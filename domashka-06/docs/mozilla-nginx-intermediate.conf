# Згенеровано на https://ssl-config.mozilla.org/
# nginx, конфігурація "Intermediate", guidelines 6.0
# (generated 2026-07-25, Mozilla Guideline v6.0, nginx 1.27, OpenSSL 3.x)

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    ssl_certificate /path/to/signed_cert_plus_intermediates;
    ssl_certificate_key /path/to/private_key;

    # intermediate configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    # чи stateful-кеш сесій, чи session tickets — але не обидва одразу
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;  # ~40000 сесій

    # HSTS (потрібен ngx_http_headers_module) — 2 роки
    add_header Strict-Transport-Security "max-age=63072000" always;
}
