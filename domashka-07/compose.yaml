services:
  app:
    build: ./app
    ports:
      - "8007:8000"   # 8000 на хості зайнятий іншим проєктом
    environment:
      DB_HOST: db          # звернення до бази за іменем сервіса
      DB_NAME: visits
      DB_USER: app
      DB_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy   # app стартує лише після готовності бази

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: visits
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    volumes:
      - db-data:/var/lib/postgresql/data   # дані переживають перезапуск
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d visits"]
      interval: 2s
      timeout: 2s
      retries: 10
    # Порт бази назовні свідомо НЕ публікуємо: app ходить у db через
    # внутрішню мережу compose, хосту цей порт не потрібен.

volumes:
  db-data:
